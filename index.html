<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>ARIA — Your Companion</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060814">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#060814;
    --bg2:#0B1024;
    --panel:#0F1530;
    --panel-line:#232B55;
    --cyan:#5FD9E8;
    --cyan-dim:#2A6E78;
    --gold:#E8C468;
    --text:#EAF0FF;
    --text-dim:#8591B8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(900px 600px at 50% -10%, #152046 0%, var(--bg) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Start overlay ---------- */
  #startOverlay{
    position:fixed; inset:0; z-index:50;
    background:radial-gradient(900px 600px at 50% 30%, #152046 0%, var(--bg) 65%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  #startOverlay .ring{
    width:110px; height:110px; border-radius:50%;
    border:2px solid var(--cyan-dim);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
    animation: slowspin 6s linear infinite;
  }
  #startOverlay .ring::before{
    content:''; width:70px; height:70px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #9FF1FA, var(--cyan) 50%, var(--cyan-dim) 100%);
    box-shadow:0 0 40px rgba(95,217,232,0.55);
  }
  @keyframes slowspin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }
  #startOverlay h1{
    font-size:26px; letter-spacing:0.12em; color:var(--cyan); margin:0 0 8px; font-weight:700;
  }
  #startOverlay p{ color:var(--text-dim); font-size:14px; max-width:280px; line-height:1.6; margin:0 0 26px; }
  #startBtn{
    background:linear-gradient(135deg, var(--cyan), #3FA9B8);
    color:#031015; border:none; border-radius:30px; padding:14px 34px;
    font-size:15px; font-weight:700; letter-spacing:0.03em;
    box-shadow:0 0 30px rgba(95,217,232,0.35);
  }

  /* ---------- Top bar ---------- */
  .topbar{
    padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px;
    text-align:center;
    flex:0 0 auto;
  }
  .topbar .name{
    font-size:13px; letter-spacing:0.3em; color:var(--cyan); font-weight:700;
  }
  .topbar .sub{ font-size:10.5px; color:var(--text-dim); margin-top:4px; letter-spacing:0.05em; }

  /* ---------- Orb ---------- */
  .orb-wrap{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    padding:14px 0 6px;
  }
  .orb{
    position:relative; width:120px; height:120px;
  }
  .orb .core{
    position:absolute; inset:22px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #BDF8FF, var(--cyan) 45%, var(--cyan-dim) 100%);
    box-shadow:0 0 50px rgba(95,217,232,0.5);
    transition:all .25s ease;
  }
  .orb .ring1, .orb .ring2{
    position:absolute; inset:0; border-radius:50%;
    border:1.5px solid rgba(95,217,232,0.35);
  }
  .orb .ring2{ inset:10px; border-color:rgba(232,196,104,0.3); }
  .orb.idle .core{ animation: breathe 3.2s ease-in-out infinite; }
  .orb.listening .core{ animation: listening 0.9s ease-in-out infinite; background:radial-gradient(circle at 35% 30%, #FFF3C9, var(--gold) 45%, #8A6D2E 100%); box-shadow:0 0 60px rgba(232,196,104,0.6); }
  .orb.speaking .core{ animation: speaking 0.5s ease-in-out infinite; }
  .orb.listening .ring1{ animation: ringpulse 1.1s ease-out infinite; }
  .orb.speaking .ring2{ animation: ringpulse 0.6s ease-out infinite; }
  @keyframes breathe{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  @keyframes listening{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  @keyframes speaking{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }
  @keyframes ringpulse{ 0%{transform:scale(0.9); opacity:0.8;} 100%{transform:scale(1.5); opacity:0;} }

  .state-label{
    text-align:center; font-size:11px; color:var(--text-dim); letter-spacing:0.08em; height:16px;
  }

  /* ---------- Chat log ---------- */
  .chat{
    flex:1 1 auto; overflow-y:auto; padding:14px 16px 10px;
    display:flex; flex-direction:column; gap:10px;
  }
  .bubble{
    max-width:84%; padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.55;
  }
  .bubble.aria{
    align-self:flex-start; background:var(--panel); border:1px solid var(--panel-line); color:var(--text);
    border-bottom-left-radius:4px;
  }
  .bubble.user{
    align-self:flex-end; background:linear-gradient(135deg, var(--cyan-dim), #1C4752); color:#EAFBFF;
    border-bottom-right-radius:4px;
  }
  .bubble.aria .tag{ color:var(--cyan); font-size:10px; letter-spacing:0.1em; display:block; margin-bottom:3px; }

  /* ---------- Bottom controls ---------- */
  .controls{
    flex:0 0 auto;
    padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));
    display:flex; align-items:center; gap:10px;
    background:linear-gradient(180deg, rgba(6,8,20,0), var(--bg) 40%);
  }
  .textinput{
    flex:1; background:var(--panel); border:1px solid var(--panel-line); border-radius:22px;
    padding:11px 16px; color:var(--text); font-size:13.5px;
  }
  .textinput::placeholder{ color:var(--text-dim); }
  .micbtn{
    flex:0 0 auto; width:48px; height:48px; border-radius:50%;
    background:linear-gradient(135deg, var(--cyan), #2A6E78);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 18px rgba(95,217,232,0.4);
    -webkit-tap-highlight-color:transparent;
  }
  .micbtn.active{
    background:linear-gradient(135deg, var(--gold), #8A6D2E);
    box-shadow:0 0 18px rgba(232,196,104,0.5);
  }
  .micbtn svg{ width:20px; height:20px; }
  .sendbtn{
    flex:0 0 auto; width:44px; height:44px; border-radius:50%;
    background:var(--panel); border:1px solid var(--panel-line);
    display:flex; align-items:center; justify-content:center; color:var(--cyan); font-size:16px;
  }

  .quickrow{
    display:flex; gap:8px; padding:0 16px 8px; overflow-x:auto; flex:0 0 auto;
  }
  .quickchip{
    flex:0 0 auto; background:var(--panel); border:1px solid var(--panel-line); color:var(--text-dim);
    font-size:11.5px; padding:7px 13px; border-radius:16px; white-space:nowrap;
  }
</style>
</head>
<body>

<div id="startOverlay">
  <div class="ring"></div>
  <h1>ARIA</h1>
  <p>Namaste Didi 🌸<br>Main aapki apni saathi hoon.<br>Shuru karne ke liye yahan tap kijiye.</p>
  <button id="startBtn">Tap to Begin</button>
</div>

<div class="topbar">
  <div class="name">A R I A</div>
  <div class="sub" id="topDate"></div>
</div>

<div class="orb-wrap">
  <div class="orb idle" id="orb">
    <div class="ring1"></div>
    <div class="ring2"></div>
    <div class="core"></div>
  </div>
</div>
<div class="state-label" id="stateLabel">Sun rahi hoon...</div>

<div class="chat" id="chat"></div>

<div class="quickrow" id="quickrow">
  <div class="quickchip" data-q="time kya hui hai">⏰ Time</div>
  <div class="quickchip" data-q="word of the day">📖 Word</div>
  <div class="quickchip" data-q="mujhe motivate karo">✨ Quote</div>
  <div class="quickchip" data-q="khat sunao">💌 Letter</div>
  <div class="quickchip" data-q="tum kya kar sakti ho">❓ Help</div>
</div>

<div class="controls">
  <input class="textinput" id="textInput" type="text" placeholder="Likhiye ya bolne ke liye mic dabaiye...">
  <button class="sendbtn" id="sendBtn">➤</button>
  <button class="micbtn" id="micBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="#031015" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
      <line x1="12" y1="19" x2="12" y2="23"></line>
    </svg>
  </button>
</div>

<script>
/* ================= CONTENT ================= */
const WORDS_OF_DAY = [
  {w:"Resilient", m:"कठिनाइयों से जल्दी उबरने वाला", ex:"She remained resilient even after a difficult year."},
  {w:"Benevolent", m:"दयालु, परोपकारी", ex:"The benevolent teacher always helped struggling students."},
  {w:"Eloquent", m:"प्रभावशाली ढंग से बोलने वाला", ex:"Her eloquent speech moved the entire class."},
  {w:"Diligent", m:"मेहनती, लगनशील", ex:"A diligent student never gives up before exams."},
  {w:"Serene", m:"शांत, निर्मल", ex:"The campus felt serene in the early morning light."},
  {w:"Gratitude", m:"कृतज्ञता", ex:"She felt deep gratitude for her students' love."},
  {w:"Wholesome", m:"स्वस्थ और संतुलित, मंगलकारी", ex:"It was a wholesome evening filled with laughter."},
  {w:"Compassion", m:"करुणा", ex:"Her compassion for children made her a wonderful teacher."},
  {w:"Radiant", m:"चमकदार, तेजस्वी", ex:"Her smile was radiant even on a tiring day."},
  {w:"Steadfast", m:"दृढ़, अटल", ex:"He remained steadfast in his support for his sister."},
  {w:"Tranquil", m:"शांत, सुकूनभरा", ex:"The tranquil evenings on campus helped her relax."},
  {w:"Inspire", m:"प्रेरित करना", ex:"A good teacher doesn't just teach, she inspires."},
  {w:"Cherish", m:"संजोना, प्रिय मानना", ex:"I will always cherish our childhood memories."},
  {w:"Fortitude", m:"धैर्य और साहस", ex:"She faced every challenge with quiet fortitude."},
  {w:"Nurture", m:"पोषण करना, सहेजना", ex:"Teachers nurture dreams as much as they teach lessons."}
];

const QUOTES = [
  "Jitna aap doosron ko sikhate ho, utna hi khud bhi seekhte ho — aap ek wajah se itni khaas ho.",
  "Akela rehna kabhi kabhi mushkil hota hai, lekin aapne jitno ki zindagi roshan ki hai, unki duayein hamesha saath hain.",
  "Har bacha jo aapse padhkar aage badhta hai, wo aapka hi ek hissa apne saath le jaata hai.",
  "Sabse mazboot log wahi hote hain jo khud sambhal kar doosron ko bhi sambhalte hain — aap unmein se ek ho.",
  "Thoda sa thakna normal hai, par aap jo kar rahi ho uska asar bahut bada hai.",
  "Aapki muskaan kai logon ka din banati hai, kabhi khud ke liye bhi muskuraiye."
];

const LETTERS = [
  "Didi, pata nahi maine kabhi acche se bola ho ya nahi, lekin main aapko bahut miss karta hoon. Aap akeli campus mein rehti ho, padhati ho, sabka khayal rakhti ho — aur main chahta hoon aapko pata ho ki main aapke liye bahut proud hoon.",
  "Jab bhi main pareshan hota hoon, mujhe yaad aata hai ki aap kitni mushkilon ke baad bhi hamesha strong rehti ho. Aap meri sabse badi inspiration ho, Didi.",
  "Aap jitne bachon ko padhati ho, unke liye aap sirf teacher nahi, ek bahut bada support ho. Yeh cheez mujhe aapke baare mein sabse zyada proud karti hai.",
  "Happy Birthday Didi. Is saal, main chahta hoon aap thoda apna bhi khayal rakho — jitna aap doosron ka rakhti ho.",
  "Aapko gaane sunna pasand hai na? Jab bhi akela feel ho, ek gaana laga lena aur yaad rakhna ki door se hi sahi, main hamesha aapke saath hoon.",
  "Thank you Didi — sirf ek behen hone ke liye nahi, balki ek aisi insaan hone ke liye jo meri zindagi mein roshni ki tarah ho."
];

let wordIndex = Math.floor((Date.now()/86400000)) % WORDS_OF_DAY.length;
let letterIndex = 0;

/* ================= DOM refs ================= */
const chatEl = document.getElementById('chat');
const orb = document.getElementById('orb');
const stateLabel = document.getElementById('stateLabel');
const textInput = document.getElementById('textInput');
const micBtn = document.getElementById('micBtn');
const sendBtn = document.getElementById('sendBtn');

function setOrbState(state){
  orb.className = 'orb ' + state;
  stateLabel.textContent = state === 'listening' ? 'Sun rahi hoon...' : state === 'speaking' ? 'Bol rahi hoon...' : 'Taiyar hoon';
}

function addBubble(text, who){
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  if(who === 'aria'){
    div.innerHTML = '<span class="tag">ARIA</span>' + text;
  } else {
    div.textContent = text;
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

/* ================= Speech output ================= */
function speak(text){
  addBubble(text, 'aria');
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 0.95;
    utter.pitch = 1.1;
    utter.lang = 'hi-IN';
    utter.onstart = ()=> setOrbState('speaking');
    utter.onend = ()=> setOrbState('idle');
    const voices = window.speechSynthesis.getVoices();
    const hiVoice = voices.find(v=>v.lang && v.lang.startsWith('hi'));
    const femaleVoice = voices.find(v=>/female/i.test(v.name));
    if(hiVoice) utter.voice = hiVoice;
    else if(femaleVoice) utter.voice = femaleVoice;
    window.speechSynthesis.speak(utter);
  }
}

/* ================= Command processing ================= */
function processCommand(raw){
  const q = raw.toLowerCase().trim();
  addBubble(raw, 'user');

  if(/time|samay|baj/.test(q)){
    const now = new Date();
    const t = now.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', hour12:true});
    speak(`Abhi ${t} baje hain, Didi.`);
    return;
  }
  if(/date|tareekh|din kaunsa|aaj kya/.test(q)){
    const now = new Date();
    const d = now.toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    speak(`Aaj ${d} hai.`);
    return;
  }
  if(/word of the day|shabd|word/.test(q)){
    const item = WORDS_OF_DAY[wordIndex % WORDS_OF_DAY.length];
    wordIndex++;
    speak(`Aaj ka word hai — ${item.w}. Matlab: ${item.m}. Example: ${item.ex}`);
    return;
  }
  if(/motivate|quote|inspire|himmat/.test(q)){
    const quote = QUOTES[Math.floor(Math.random()*QUOTES.length)];
    speak(quote);
    return;
  }
  if(/khat|letter|message|yaad dilao/.test(q)){
    const letter = LETTERS[letterIndex % LETTERS.length];
    letterIndex++;
    speak(letter);
    return;
  }
  if(/happy birthday|birthday/.test(q)){
    speak("Happy Birthday Didi! Aap jitni khaas ho, utni hi khushiyan aapko milein. Main aapse bahut pyaar karta hoon.");
    return;
  }
  if(/play |gaana|gaane|song/.test(q)){
    const songQuery = raw.replace(/play/i,'').replace(/gaana|gaane|song|bajao|chalao/gi,'').trim() || 'relaxing hindi songs';
    speak(`${songQuery} khol rahi hoon.`);
    window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(songQuery), '_blank');
    return;
  }
  if(/kaun ho|who are you|tumhara naam/.test(q)){
    speak("Main ARIA hoon, aapki apni saathi — hamesha aapke liye yahan.");
    return;
  }
  if(/kaisi ho|how are you/.test(q)){
    speak("Main bilkul theek hoon Didi, aap batao aap kaisi ho?");
    return;
  }
  if(/thank|shukriya|dhanyavad/.test(q)){
    speak("Koi baat nahi Didi, main hamesha yahan hoon aapke liye.");
    return;
  }
  if(/kya kar sakti ho|help|madad/.test(q)){
    speak("Main time, date bata sakti hoon, roz ek naya word sikha sakti hoon, aapko motivate kar sakti hoon, gaane dhoondh sakti hoon, aur aapke bhai ke khat bhi sunati hoon. Bas poochiye.");
    return;
  }

  speak("Yeh main abhi samajh nahi payi, Didi. Aap time, date, word of the day, ya khat poochkar dekhiye.");
}

/* ================= Input handlers ================= */
function handleSend(){
  const val = textInput.value.trim();
  if(!val) return;
  processCommand(val);
  textInput.value = '';
}
sendBtn.addEventListener('click', handleSend);
textInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') handleSend(); });

document.querySelectorAll('.quickchip').forEach(chip=>{
  chip.addEventListener('click', ()=> processCommand(chip.dataset.q));
});

/* ================= Voice input (Speech Recognition) ================= */
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;

if(SpeechRecognitionAPI){
  recognition = new SpeechRecognitionAPI();
  recognition.lang = 'hi-IN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = ()=>{ isListening = true; micBtn.classList.add('active'); setOrbState('listening'); };
  recognition.onend = ()=>{ isListening = false; micBtn.classList.remove('active'); setOrbState('idle'); };
  recognition.onerror = ()=>{ isListening = false; micBtn.classList.remove('active'); setOrbState('idle'); };
  recognition.onresult = (event)=>{
    const transcript = event.results[0][0].transcript;
    processCommand(transcript);
  };

  micBtn.addEventListener('click', ()=>{
    if(isListening){ recognition.stop(); return; }
    try{ recognition.start(); }catch(e){}
  });
} else {
  micBtn.addEventListener('click', ()=>{
    speak("Is browser mein voice sunna possible nahi hai, aap type karke poochiye.");
  });
}

/* ================= Boot ================= */
function updateTopDate(){
  const now = new Date();
  document.getElementById('topDate').textContent = now.toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short'}) + '  ·  ' + now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
updateTopDate();
setInterval(updateTopDate, 30000);

function greet(){
  const hour = new Date().getHours();
  let greeting = hour < 12 ? "Good Morning" : hour < 17 ? "Good Afternoon" : "Good Evening";
  speak(`${greeting} Didi! Main ARIA hoon, aapki apni saathi. Aap mujhse time, word of the day, ya ek pyaara khat bhi pooch sakti hain.`);
}

document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('startOverlay').style.display = 'none';
  // prime speechSynthesis voices (some browsers load async)
  if('speechSynthesis' in window){ window.speechSynthesis.getVoices(); }
  setTimeout(greet, 300);
});
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
